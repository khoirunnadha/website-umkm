    <main class="page">
  <h1>Kontak Kopi Nusa</h1>
  <p>Gunakan form ini untuk bertanya tentang produk, pesanan, atau kerja sama.</p>

  <form id="form-kontak" action="#" method="post">
    <div class="field">
      <label for="nama">Nama lengkap</label>
      <input id="nama" name="nama" type="text" required minlength="3" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
    </div>

    <div class="field">
      <label for="paket">Paket yang diminati</label>
      <select id="paket" name="paket" required>
        <option value="">Pilih paket</option>
        <option value="rumahan">Paket rumahan</option>
        <option value="kantor">Paket kantor</option>
        <option value="reseller">Paket reseller</option>
      </select>
    </div>

    <fieldset>
      <legend>Topik pertanyaan</legend>
      <label><input type="radio" name="topik" value="produk" required /> Produk</label>
      <label><input type="radio" name="topik" value="pesanan" /> Pesanan</label>
      <label><input type="radio" name="topik" value="kerja-sama" /> Kerja sama</label>
    </fieldset>

    <div class="field">
      <label for="pesan">Pesan</label>
      <textarea id="pesan" name="pesan" rows="4" required minlength="10"></textarea>
    </div>

    <button type="submit">Kirim Pesan</button>
  </form>

  <section aria-labelledby="preview-title">
    <h2 id="preview-title">Preview</h2>
    <pre id="preview">Data form akan muncul di sini.</pre>
  </section>
</main>

<script src="js/form.js"></script>
