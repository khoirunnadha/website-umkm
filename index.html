<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kopi Nusa - Website UMKM</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
    <main class="page">
        <section class="hero">
            <p class="eyebrow">UMKM Pekalongan</p>
            <h1>Kopi Nusa</h1>
            <p>Kopi pilihan untuk teman belajar, bekerja, dan diskusi</p>
            <button id="promoButton" type="button">Lihat Promo Hari Ini</button>        
        </section>

        <section aria-labelledby="produk-title">
            <h2 id="produk-title">Produk Unggulan</h2>
            <ul class="products">
                <li>Kopi Tubruk Signature - Rp 25.000</li>
                <li>Kopi Luwak - Rp 150.000</li>
                <li>Kopi Arabika - Rp 40.000</li>
            </ul>
        </section>
        <section class="footer"> 
            <div class="alamat">
                <h3>Lokasi</h3>
                <p>Jl. Diponegoro No. 123, Pekalongan, Jawa Tengah</p>
            </div>
            <div class="jam-operasional">
                <h3>Jam Operasional</h3>
                <p>Senin - Jumat: 08.00 - 20.00</p>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
